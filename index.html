<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Солодкий ряд">
<meta name="theme-color" content="#F8E6EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} html,body{margin:0} [hidden]{display:none!important}</style>
<title>Солодкий ряд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  /* Layout: one-screen app. Map = a week of orders as dessert plates; Game = paper receipt over a chocolate tray, side by side on landscape tablets */
  --milk:#F8E6EC; --milk-dot:#F0D0DC; --paper:#FFFBF5; --cocoa:#3B2224; --line:#E9C9D4;
  --rasp:#C9245E; --rasp-deep:#8E1442; --gold:#F2B21B; --muted:#8C5E68; --mint-bg:#DDF3E4; --mint-fg:#2E7D4F;
  --scrim:rgba(59,34,36,.5);
  --display:'Lobster', Georgia, 'Times New Roman', serif;
  --body:'Nunito', ui-rounded, -apple-system, system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0; overflow:hidden; overscroll-behavior:none;
  background:radial-gradient(var(--milk-dot) 1.6px, transparent 2.1px) 0 0/20px 20px, var(--milk);
  color:var(--cocoa); font-family:var(--body); font-size:15px; font-weight:700;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button{font-family:inherit; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.app{
  height:100%; box-sizing:border-box; max-width:1100px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
.screen{height:100%; display:flex; flex-direction:column; gap:12px; min-height:0}

/* ---------- map ---------- */
.maphead{text-align:center; padding-top:6px; display:flex; flex-direction:column; gap:8px; align-items:center}
h1{
  font:400 clamp(42px, 12vw, 68px)/1 var(--display); color:var(--rasp); margin:0;
  text-shadow:0 3px 0 var(--paper), 0 6px 0 var(--line); text-wrap:balance;
}
.maphead p{margin:0; color:var(--muted); max-width:34ch}
.mapbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center}
.starsum{display:inline-flex; align-items:center; gap:6px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--cocoa)}
.levels{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:14px; padding:4px 2px 16px; width:100%; max-width:560px; margin:0 auto; box-sizing:border-box}
.day{background:var(--paper); border-radius:22px; padding:12px 14px 16px; box-shadow:0 3px 0 var(--line)}
.day h3{margin:0 0 10px; font:400 23px/1.1 var(--display); display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.day h3 span{font:800 12px var(--body); color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.row{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
.lv{
  aspect-ratio:1; width:100%; max-width:84px; justify-self:center; border:0; border-radius:50%; padding:0; cursor:pointer;
  background:radial-gradient(circle at 50% 46%, var(--paper) 0 54%, var(--milk) 55% 100%);
  box-shadow:0 3px 0 var(--line), inset 0 0 0 2px var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--rasp);
}
.lv .num{font:400 clamp(20px, 6vw, 28px)/1 var(--display)}
.lv:active{transform:translateY(2px)}
.lv.current{box-shadow:0 3px 0 var(--rasp-deep), inset 0 0 0 3px var(--rasp); animation:bob 1.8s ease-in-out infinite}
.lv.locked{color:var(--muted); opacity:.5; cursor:default}
.lv.locked svg{width:18px; height:18px}
.stars{display:flex; gap:1px}
.star{width:10px; height:10px; background:var(--line);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:var(--gold)}

/* ---------- buttons ---------- */
.btn{
  font:900 17px var(--body); background:var(--rasp); color:#fff; border:0; border-radius:999px;
  padding:13px 24px; box-shadow:0 4px 0 var(--rasp-deep); cursor:pointer;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--rasp-deep)}
.btn.ghost{background:var(--paper); color:var(--rasp); box-shadow:0 4px 0 var(--line), inset 0 0 0 2px var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line), inset 0 0 0 2px var(--line)}
.icon-btn{
  height:40px; min-width:40px; border:0; border-radius:999px; background:var(--paper); color:var(--cocoa);
  box-shadow:0 3px 0 var(--line); display:inline-flex; align-items:center; justify-content:center; gap:4px;
  font:800 15px var(--body); padding:0 12px; cursor:pointer;
}
.icon-btn svg{width:20px; height:20px}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.icon-btn.off .wave{display:none}
.icon-btn .mute{display:none}
.icon-btn.off .mute{display:inline}

.icon-btn.off{color:var(--muted); opacity:.75}
.seg{display:inline-flex; background:var(--paper); border-radius:999px; padding:4px; box-shadow:0 3px 0 var(--line); gap:2px}
.seg button{border:0; background:transparent; border-radius:999px; padding:8px 13px; font:900 14px var(--body); color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--rasp); color:#fff}
.modehint{font-size:13px; min-height:1.3em}
.langs button{padding:6px 11px; font-size:13px}
.day.future{opacity:.55; padding-bottom:12px}
.day.future h3{margin:0}

/* ---------- game ---------- */
.topbtns{display:flex; gap:6px}
.tools{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.tool{
  position:relative; border:0; border-radius:16px; background:var(--paper); color:var(--rasp); cursor:pointer;
  box-shadow:0 3px 0 var(--line); padding:7px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:1px;
  font:800 12px var(--body);
}
.tool svg{width:24px; height:24px}
.tool span{color:var(--cocoa)}
.tool .cnt{position:absolute; top:-6px; right:-4px; min-width:20px; height:20px; border-radius:10px; background:var(--gold); color:var(--cocoa); font:900 12px/20px var(--body); box-shadow:0 2px 0 #C98A06}
.tool:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.tool:disabled{opacity:.4; cursor:default}
.tool.active{background:var(--rasp); color:#fff}
.tool.active span{color:#fff}
@media (max-height:700px) and (max-width:719px){ .tool span{display:none} .tool{padding:6px 4px} .why{display:none} }
.side{display:flex; flex-direction:column; gap:10px; flex:none; min-width:0}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px}
.lvl{font:400 24px/1 var(--display); color:var(--rasp)}
.receipt{background:var(--paper); border-radius:16px 16px 0 0; padding:10px 14px 12px; position:relative; margin-bottom:8px}
.receipt::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:8px;
  background:radial-gradient(circle at 8px 0, var(--paper) 7px, transparent 7.5px) 0 0/16px 8px repeat-x;
}
.receipt-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.who-box{min-width:0}
.no{font:800 11px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.who{font:400 21px/1.15 var(--display); text-wrap:balance}
.why{margin:2px 0 0; color:var(--muted); font-size:13px}
.moves{background:var(--rasp); color:#fff; border-radius:16px; padding:6px 10px 5px; text-align:center; box-shadow:0 3px 0 var(--rasp-deep); min-width:58px; flex:none}
.moves b{display:block; font:900 26px/1 var(--body); font-variant-numeric:tabular-nums}
.moves small{font:900 10px var(--body); letter-spacing:.1em; text-transform:uppercase}
.moves.low{animation:throb .9s ease-in-out infinite}
.goals{display:flex; gap:8px; flex-wrap:wrap; border-top:2px dashed var(--line); padding-top:9px; margin-top:9px}
.goal{display:flex; align-items:center; gap:6px; background:var(--milk); border-radius:999px; padding:3px 12px 3px 3px; font:900 18px var(--body); font-variant-numeric:tabular-nums}
.goal canvas{width:30px; height:30px; display:block}
.goal.done{background:var(--mint-bg); color:var(--mint-fg)}
.scoreline{display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:13px; padding:0 4px}
.scoreline b{color:var(--cocoa); font-weight:900; font-variant-numeric:tabular-nums}
.boardwrap{flex:1; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center}
#cv{display:block; touch-action:none; border-radius:18px; box-shadow:0 6px 0 #2A1718, 0 14px 30px rgba(59,34,36,.25); max-width:100%}

@media (min-width:720px) and (min-aspect-ratio:5/4){
  #game{flex-direction:row; gap:28px; align-items:stretch}
  .side{width:300px; justify-content:center}
}

/* ---------- overlay ---------- */
.overlay{
  position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
}
.card{
  background:var(--paper); border-radius:26px; padding:22px 20px 20px; width:100%; max-width:360px; box-sizing:border-box;
  text-align:center; box-shadow:0 12px 34px rgba(59,34,36,.35); animation:pop .38s cubic-bezier(.2,1.4,.4,1);
  max-height:100%; overflow-y:auto;
}
.card h2{font:400 32px/1.1 var(--display); color:var(--rasp); margin:4px 0 6px; text-wrap:balance}
.card p{margin:6px 0; color:var(--muted)}
.card .rules{font-size:13px; background:var(--milk); border-radius:14px; padding:10px 12px; text-align:left; color:var(--cocoa)}
.need{list-style:none; padding:0; margin:14px 0 6px; display:flex; flex-direction:column; gap:6px; text-align:left}
.need li{display:flex; align-items:center; gap:10px; font-weight:800; border-bottom:1px dashed var(--line); padding-bottom:6px}
.need canvas{width:34px; height:34px; display:block; flex:none}
.need b{margin-left:auto; font-weight:900; font-variant-numeric:tabular-nums}
.need li.ok b{color:var(--mint-fg)}
.actions{display:flex; flex-direction:column; gap:12px; margin-top:16px}
.bigstars{display:flex; justify-content:center; gap:10px; margin:10px 0 6px}
.bigstars .star{width:50px; height:50px}
.bigstars .star.on{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars .star.on:nth-child(2){animation-delay:.18s}
.bigstars .star.on:nth-child(3){animation-delay:.36s}
.final-score{font:900 26px var(--body); color:var(--cocoa); font-variant-numeric:tabular-nums}

@keyframes pop{from{transform:scale(.85); opacity:0}to{transform:none; opacity:1}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes throb{50%{transform:scale(1.08)}}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>


<div class="app">
  <section id="map" class="screen">
    <header class="maphead">
      <h1 id="gameTitle">Солодкий ряд</h1>
      <p id="tagline"></p>
      <div class="mapbar">
        <button class="btn" id="btnPlay">Продовжити</button>
        <span class="starsum"><span class="star on" style="width:18px;height:18px"></span><span id="starTotal">0</span> / 300</span>
      </div>
      <div class="mapbar">
        <div class="seg" id="modes" role="group" aria-label="Режим гри">
          <button data-mode="moves" aria-pressed="true"></button>
          <button data-mode="calm" aria-pressed="false"></button>
          <button data-mode="time" aria-pressed="false"></button>
        </div>
        <button class="icon-btn btnMusic" aria-label="Музика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/><path class="mute" d="M3 3l18 18"/></svg></button>
        <button class="icon-btn btnSound" aria-label="Звуки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg></button>
      </div>
      <p class="modehint" id="modeHint"></p>
      <div class="seg langs" id="langs" role="group"></div>
    </header>
    <div class="levels" id="levels"></div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="side">
      <div class="topbar">
        <button class="icon-btn" id="btnBack" aria-label="До мапи">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt"></span>
        </button>
        <div class="lvl"><span id="lvlWord"></span> <span id="lvlNum">1</span></div>
        <span class="topbtns">
          <button class="icon-btn btnMusic" aria-label="Музика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/><path class="mute" d="M3 3l18 18"/></svg></button>
          <button class="icon-btn btnSound" aria-label="Звуки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg></button>
        </span>
      </div>
      <div class="receipt">
        <div class="receipt-top">
          <div class="who-box">
            <div class="no" id="orderNo">Замовлення № 001</div>
            <div class="who" id="who">Пані Оксана</div>
            <p class="why" id="why"></p>
          </div>
          <div class="moves" id="movesBox"><b id="moves">25</b><small id="movesLabel">ходів</small></div>
        </div>
        <div class="goals" id="goals"></div>
      </div>
      <div class="scoreline"><span><span id="bestWord"></span> <b id="best">0</b></span><span><span id="scoreWord"></span> <b id="score">0</b></span></div>
      <div class="tools">
        <button class="tool" id="tool-helper" aria-label="Помічник: зробить хід за вас">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L15 9"/><path d="M15 3v3M18.5 4.5l-2 2M21 9h-3M12 6.5L10.5 5M18 12l1.5 1.5" /><path d="M13.5 10.5l-1-1"/></svg>
          <span id="tw-helper"></span><b class="cnt">3</b>
        </button>
        <button class="tool" id="tool-spoon" aria-label="Ложка: прибрати одну солодку">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="15.5" cy="7.5" rx="4" ry="5" transform="rotate(45 15.5 7.5)" fill="currentColor" fill-opacity=".25"/><path d="M12.5 10.5L4 19"/></svg>
          <span id="tw-spoon"></span><b class="cnt">2</b>
        </button>
        <button class="tool" id="tool-mix" aria-label="Міксер: перемішати тацю">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/><path d="M20 7a8 8 0 0 1 0 0M4 17"/></svg>
          <span id="tw-mix"></span><b class="cnt">1</b>
        </button>
      </div>
    </div>
    <div class="boardwrap" id="boardWrap"><canvas id="cv" aria-label="Ігрове поле"></canvas></div>
  </section>

  <div id="overlay" class="overlay" hidden></div>
</div>

<script>

/* ---------- board setup ---------- */
function fillBoard() {
  for (let tries = 0; tries < 300; tries++) {
    B = new Array(N * N);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const i = r * N + c; let t, guard = 0;
      do { t = rnd(L.types); } while (guard++ < 30 && ((c >= 2 && B[i - 1].t === t && B[i - 2].t === t) || (r >= 2 && B[i - N].t === t && B[i - 2 * N].t === t)));
      B[i] = newPiece(t, null, r, c);
    }
    if (!findGroups().length && findMove()) break;
  }
}

/* ---------- effects ---------- */
function centerOf(i) { return [pad + (i % N + .5) * cs, pad + (Math.floor(i / N) + .5) * cs]; }
function burst(p) {
  const x = pad + (p.dc + .5) * cs, y = pad + (p.dr + .5) * cs, col = p.t >= 0 ? TYPE_COLORS[p.t] : '#8D6E63';
  const n = reduce ? 3 : 7;
  for (let k = 0; k < n; k++) { const a = Math.random() * TAU, v = (80 + Math.random() * 180) * (cs / 45); fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0, max: .5 + Math.random() * .3, col: k % 3 ? col : '#FFFFFF', size: cs * (.05 + Math.random() * .05) }); }
}
function floatText(text, col, row, big) { fx.texts.push({ text, x: pad + (col + .5) * cs, y: pad + (row + .5) * cs, life: 0, max: big ? 1.3 : .8, big }); }
function confetti(count, ox, oy) {
  const n = reduce ? Math.min(12, count) : count;
  for (let k = 0; k < n; k++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = (250 + Math.random() * 380) * (cs / 45);
    fx.parts.push({ x: ox ?? S / 2, y: oy ?? S * .55, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1 + Math.random() * .6,
      col: TYPE_COLORS[k % 6], size: cs * (.07 + Math.random() * .05), rect: true, rot: Math.random() * TAU, vr: (Math.random() - .5) * 14 });
  }
}
function shake(m) { if (!reduce) fx.shake = Math.max(fx.shake, m); }
function cheer(c) {
  const w = D.cheers[Math.min(c, D.cheers.length - 1)];
  if (w) floatText(w, 3.5, 3.0, true);
  fx.texts.push({ text: T('combo', { n: c }), x: S / 2, y: pad + 4.15 * cs, life: 0, max: 1.1, mid: true, scale: 1 + Math.min(c, 6) * .08 });
  sfx.combo(c);
  if (c >= 3) { confetti(14 * c); shake(2 + c); fx.flash = .25; }
}

function effect(i, p) {
  const r = Math.floor(i / N), c = i % N, out = [];
  if (p.sp === 'h') { for (let k = 0; k < N; k++) out.push(r * N + k); fx.beams.push({ k: 'h', r, c, life: 0, max: .38 }); sfx.zap(); }
  else if (p.sp === 'v') { for (let k = 0; k < N; k++) out.push(k * N + c); fx.beams.push({ k: 'v', r, c, life: 0, max: .38 }); sfx.zap(); }
  else if (p.sp === 'w') { for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const rr = r + a, cc = c + b; if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc); } fx.beams.push({ k: 'ring', r, c, life: 0, max: .45, rad: 1.6 }); sfx.boom(); }
  else if (p.sp === 'b') {
    const present = []; for (const q of B) if (q && q.t >= 0) present.push(q.t);
    if (present.length) { const t = present[rnd(present.length)]; for (let j = 0; j < N * N; j++) if (B[j] && B[j].t === t) { out.push(j); fx.beams.push({ k: 'link', from: i, to: j, life: 0, max: .4 }); } }
    fx.beams.push({ k: 'ring', r, c, life: 0, max: .5, rad: 3 }); sfx.boom();
  }
  return out;
}

function countOrder(t) { for (const o of orders) if (o.t === t && o.got < o.need) { o.got++; break; } }

async function clearCells(set, creates = [], cascade = 1, skip = new Set()) {
  const all = new Set(), queue = [];
  const add = i => { if (i < 0 || i >= N * N || all.has(i) || !B[i]) return; all.add(i); queue.push(i); };
  set.forEach(add);
  while (queue.length) { const i = queue.shift(), p = B[i]; if (!p.sp || skip.has(i)) continue; for (const j of effect(i, p)) add(j); }
  if (!all.size) return;
  let sx = 0, sy = 0;
  for (const i of all) { const p = B[i]; burst(p); sx += p.dc; sy += p.dr; }
  const gained = all.size * 30 * cascade + creates.length * 100;
  score += gained; floatText('+' + gained, sx / all.size, sy / all.size);
  sfx.pop(cascade);
  if (all.size >= 9) { shake(2 + all.size / 6); fx.flash = Math.max(fx.flash, Math.min(.35, all.size / 60)); }
  const ps = [...all].map(i => B[i]);
  await tween(200 * SP, k => { for (const p of ps) { p.s = k < .3 ? 1 + k * .5 : 1.15 * (1 - (k - .3) / .7); p.a = 1 - Math.max(0, (k - .45) / .55); } });
  for (const i of all) { const p = B[i]; if (p.t >= 0) countOrder(p.t); if (G[i] > 0) { G[i]--; countOrder('g'); } B[i] = null; }
  for (const cr of creates) { const np = newPiece(cr.t, cr.sp, Math.floor(cr.pos / N), cr.pos % N); np.s = .2; B[cr.pos] = np; }
  if (creates.length) { sfx.special(); await tween(160 * SP, k => { for (const cr of creates) { const p = B[cr.pos]; if (p) p.s = .2 + .8 * easeOutBack(k); } }); }
  updateHud();
}

function animateFall(moving) {
  if (!moving.length) return Promise.resolve();
  const per = moving.map(m => ({ p: m.p, from: m.from, to: m.p.r, d: (150 + 80 * Math.sqrt(Math.abs(m.p.r - m.from))) * SP, delay: (m.delay || 0) * SP }));
  const total = Math.max(...per.map(m => m.d + m.delay));
  return tween(total, k => { const t = k * total; for (const m of per) { const u = Math.min(1, Math.max(0, (t - m.delay) / m.d)); m.p.dr = m.from + (m.to - m.from) * fallEase(u); } });
}
async function gravity() {
  const moving = [];
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) { const i = r * N + c, p = B[i]; if (!p) continue; if (r !== w) { B[w * N + c] = p; B[i] = null; moving.push({ p, from: p.dr }); p.r = w; } w--; }
    const spawn = w + 1;
    for (let r = w; r >= 0; r--) { const p = newPiece(rnd(L.types), null, r, c); p.dr = r - spawn - .3; B[r * N + c] = p; moving.push({ p, from: p.dr }); }
  }
  await animateFall(moving);
}
async function cascadeLoop(prefer) {
  let cascade = 0;
  for (;;) {
    const groups = findGroups(); if (!groups.length) break;
    cascade++;
    const set = new Set(), creates = [];
    for (const g of groups) { g.cells.forEach(i => set.add(i)); const s = specialFor(g, prefer); if (s) creates.push(s); }
    prefer = null;
    await clearCells(set, creates, cascade);
    await gravity();
    if (cascade >= 2) cheer(cascade);
  }
}

async function animSwap(a, b) {
  const pa = B[a], pb = B[b], ar = pa.r, ac = pa.c, br = pb.r, bc = pb.c;
  await tween(150 * SP, k => { const e = easeInOut(k); pa.dr = ar + (br - ar) * e; pa.dc = ac + (bc - ac) * e; pb.dr = br + (ar - br) * e; pb.dc = bc + (ac - bc) * e; });
  B[a] = pb; B[b] = pa; pa.r = br; pa.c = bc; pb.r = ar; pb.c = ac;
  pa.dr = br; pa.dc = bc; pb.dr = ar; pb.dc = ac;
}

async function comboBomb(a, b) {
  const bombPos = B[a].sp === 'b' ? a : b, otherPos = bombPos === a ? b : a, other = B[otherPos];
  const set = new Set([bombPos, otherPos]), skip = new Set([bombPos]);
  const [br, bc] = [Math.floor(bombPos / N), bombPos % N];
  if (other.sp === 'b') {
    skip.add(otherPos); for (let i = 0; i < N * N; i++) set.add(i);
    fx.beams.push({ k: 'ring', r: br, c: bc, life: 0, max: .7, rad: 8 }); sfx.boom(); floatText(T('fxBoom'), 3.5, 3.2, true);
  } else {
    const targets = []; for (let i = 0; i < N * N; i++) if (B[i] && B[i].t === other.t) targets.push(i);
    for (const i of targets) fx.beams.push({ k: 'link', from: bombPos, to: i, life: 0, max: .45 });
    if (other.sp) {
      for (const i of targets) if (!B[i].sp) B[i].sp = other.sp === 'w' ? 'w' : (Math.random() < .5 ? 'h' : 'v');
      sfx.special();
      await tween(320 * SP, k => { for (const i of targets) if (B[i]) B[i].s = 1 + .18 * Math.sin(k * Math.PI); });
    }
    targets.forEach(i => set.add(i)); sfx.boom();
    floatText(other.sp ? T('fxStorm') : T('fxTruffle'), 3.5, 3.0, true);
  }
  shake(9); fx.flash = .45; confetti(40, ...centerOf(bombPos));
  await clearCells(set, [], 1, skip); await gravity(); await cascadeLoop();
}
async function comboSpecials(a, b) {
  const kinds = [B[a].sp, B[b].sp], r = Math.floor(b / N), c = b % N;
  const set = new Set([a, b]), skip = new Set([a, b]);
  const W = kinds.filter(k => k === 'w').length;
  const addRow = rr => { if (rr < 0 || rr >= N) return; for (let k = 0; k < N; k++) set.add(rr * N + k); fx.beams.push({ k: 'h', r: rr, c, life: 0, max: .4 }); };
  const addCol = cc => { if (cc < 0 || cc >= N) return; for (let k = 0; k < N; k++) set.add(k * N + cc); fx.beams.push({ k: 'v', r, c: cc, life: 0, max: .4 }); };
  if (W === 2) { for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) { const rr = r + x, cc = c + y; if (rr >= 0 && rr < N && cc >= 0 && cc < N) set.add(rr * N + cc); } fx.beams.push({ k: 'ring', r, c, life: 0, max: .55, rad: 2.6 }); sfx.boom(); }
  else if (W === 1) { for (let d = -1; d <= 1; d++) { addRow(r + d); addCol(c + d); } sfx.zap(); sfx.boom(); }
  else { addRow(r); addCol(c); sfx.zap(); }
  floatText(W === 2 ? T('fxWrap2') : W === 1 ? T('fxWrapLine') : T('fxCross'), 3.5, 3.0, true);
  shake(6); fx.flash = .3; confetti(24, ...centerOf(b));
  await clearCells(set, [], 1, skip); await gravity(); await cascadeLoop();
}

async function shuffleBoard() {
  floatText(T('fxShuffle'), 3.5, 3.2, true);
  await wait(400);
  for (const p of B) { p.or = p.r; p.oc = p.c; }
  let tries = 0;
  do {
    const ps = shuffleArr(B.slice());
    for (let i = 0; i < N * N; i++) { B[i] = ps[i]; ps[i].r = Math.floor(i / N); ps[i].c = i % N; }
    if (++tries > 150) for (const p of B) if (!p.sp) p.t = rnd(L.types);
  } while ((findGroups().length || !findMove()) && tries < 400);
  await tween(450 * SP, k => { const e = easeInOut(k); for (const p of B) { p.dr = p.or + (p.r - p.or) * e; p.dc = p.oc + (p.c - p.oc) * e; } });
  for (const p of B) { p.dr = p.r; p.dc = p.c; }
}

/* ---------- turn flow ---------- */
function useMove() { used++; if (mode === 'moves') moves--; updateHud(); }
const ordersDone = () => orders.every(o => o.got >= o.need);

async function trySwap(a, b) {
  if (busy || !playing) return;
  busy = true; selected = -1; hint = null;
  try {
    const pa = B[a], pb = B[b];
    sfx.swap();
    await animSwap(a, b);
    if (pa.sp === 'b' || pb.sp === 'b') { useMove(); await comboBomb(a, b); }
    else if (pa.sp && pb.sp) { useMove(); await comboSpecials(a, b); }
    else if (findGroups().length) { useMove(); await cascadeLoop([b, a]); }
    else { sfx.nope(); await animSwap(a, b); return; }
    await afterTurn();
  } finally { busy = false; lastAct = performance.now(); }
}

async function afterTurn() {
  updateHud();
  if (ordersDone()) { await winSequence(); return; }
  if (mode === 'moves' && moves <= 0) { playing = false; sfx.lose(); showLose(); return; }
  if (mode === 'time' && timeLeft <= 0) { playing = false; sfx.lose(); showLose(); return; }
  if (!findMove()) await shuffleBoard();
}

async function winSequence() {
  playing = false; spoonMode = false;
  let stars, bonus;
  if (mode === 'time') {
    const f = timeLeft / L.time; stars = f >= .25 ? 3 : f >= .1 ? 2 : 1; bonus = Math.floor(timeLeft / 5);
  } else {
    const left = L.moves - used; stars = left >= Math.ceil(L.moves * .25) ? 3 : left >= Math.ceil(L.moves * .1) ? 2 : 1; bonus = Math.max(0, left);
  }
  sfx.win(); floatText(T('fxDone'), 3.5, 3.2, true); confetti(60); shake(4);
  await wait(900);
  let k = Math.min(bonus, 12);
  if (k) floatText(mode === 'time' ? T('fxBonusTime') : T('fxBonusMoves'), 3.5, 4.4, true);
  while (k-- > 0) {
    const cand = []; for (let i = 0; i < N * N; i++) if (B[i] && B[i].t >= 0 && !B[i].sp) cand.push(i);
    if (!cand.length) break;
    const p = B[cand[rnd(cand.length)]]; p.sp = Math.random() < .5 ? 'h' : 'v';
    bonus--; if (mode === 'moves') moves--; if (mode === 'time') timeLeft = Math.max(0, timeLeft - 5);
    score += 250; updateHud(); sfx.special();
    tween(160 * SP, e => { p.s = 1 + .3 * Math.sin(e * Math.PI); });
    await wait(120);
  }
  if (bonus > 0) { score += bonus * 250; if (mode === 'moves') moves = 0; updateHud(); }
  for (let round = 0; round < 5; round++) {
    const set = new Set(); for (let i = 0; i < N * N; i++) if (B[i] && B[i].sp && B[i].sp !== 'b') set.add(i);
    if (!set.size) break;
    await clearCells(set, [], 2); await gravity(); await cascadeLoop();
  }
  const n = L.n;
  save.s[n] = Math.max(save.s[n] || 0, stars);
  const isRecord = score > (save.b[n] || 0);
  save.b[n] = Math.max(save.b[n] || 0, score);
  if (n >= save.u) save.u = Math.min(LEVELS + 1, n + 1);
  persist(); updateHud();
  await wait(300);
  showWin(stars, isRecord);
}

/* ---------- helpers (tools) ---------- */
async function useHelper() {
  if (busy || !playing || tools.helper <= 0) return;
  const mv = bestMove(); if (!mv) return;
  tools.helper--; spoonMode = false; selected = -1; updateHud();
  busy = true; hint = mv; sfx.special();
  floatText(T('fxHelper'), 3.5, 3.0, true);
  await wait(550);
  hint = null; busy = false;
  await trySwap(mv[0], mv[1]);
}
async function useSpoon(i) {
  if (busy || !playing || tools.spoon <= 0 || !B[i]) return;
  tools.spoon--; spoonMode = false; selected = -1; updateHud();
  busy = true; hint = null;
  try {
    shake(3);
    await clearCells(new Set([i]), [], 1); await gravity(); await cascadeLoop();
    await afterTurn();
  } finally { busy = false; lastAct = performance.now(); updateHud(); }
}
async function useMix() {
  if (busy || !playing || tools.mix <= 0) return;
  tools.mix--; spoonMode = false; selected = -1; updateHud();
  busy = true; hint = null;
  try { await shuffleBoard(); if (findGroups().length) await cascadeLoop(); await afterTurn(); }
  finally { busy = false; lastAct = performance.now(); updateHud(); }
}

/* ---------- HUD ---------- */
function buildGoals() {
  const box = $('#goals'); box.innerHTML = '';
  orders.forEach((o, i) => {
    const el = document.createElement('div'); el.className = 'goal'; el.id = 'goal' + i;
    el.title = o.t === 'g' ? T('glaze') : D.types[o.t];
    el.appendChild(iconCanvas(o.t, 30));
    const s = document.createElement('span'); s.className = 'cnt'; el.appendChild(s);
    box.appendChild(el);
  });
}
let lastCounter = '';
function updateCounter() {
  let val, label, low;
  if (mode === 'time') { const s = Math.max(0, Math.ceil(timeLeft)); val = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); label = T('timeLabel'); low = playing && s <= 15; }
  else if (mode === 'calm') { val = used; label = movesText(used).replace(/^\d+ /, ''); low = false; }
  else { val = Math.max(0, moves); label = movesText(Math.max(0, moves)).replace(/^\d+ /, ''); low = playing && moves <= 5; }
  const key = val + label + low;
  if (key === lastCounter) return; lastCounter = key;
  $('#moves').textContent = val; $('#movesLabel').textContent = label;
  $('#movesBox').classList.toggle('low', low);
}
function updateHud() {
  if (!L) return;
  updateCounter();
  for (const k of Object.keys(TOOLS)) {
    const b = document.getElementById('tool-' + k);
    b.querySelector('.cnt').textContent = tools[k];
    b.disabled = tools[k] <= 0;
    b.classList.toggle('active', k === 'spoon' && spoonMode);
  }
  $('#score').textContent = score.toLocaleString('uk-UA');
  $('#best').textContent = (save.b[L.n] || 0).toLocaleString('uk-UA');
  orders.forEach((o, i) => {
    const el = document.getElementById('goal' + i); if (!el) return;
    const left = Math.max(0, o.need - o.got);
    el.querySelector('.cnt').textContent = left ? left : '✓';
    el.classList.toggle('done', !left);
  });
}

ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  sfx.unlock();
  const act = b.dataset.act;
  if (act === 'start') { hideOverlay(); beginPlay(); }
  else if (act === 'next') { hideOverlay(); startLevel(Math.min(LEVELS, L.n + 1)); }
  else if (act === 'retry') { hideOverlay(); startLevel(L.n); }
  else if (act === 'map') { hideOverlay(); playing = false; showMap(); }
  else if (act === 'stay') { hideOverlay(); }
  else if (act === 'extra') { extraUsed = true; if (mode === 'time') timeLeft += 30; else moves += 5; playing = true; hideOverlay(); updateHud(); lastAct = performance.now(); }
});

/* ---------- screens ---------- */
function showScreen(id) { $('#map').hidden = id !== 'map'; $('#game').hidden = id !== 'game'; }
function showMap() {
  showScreen('map');
  const box = $('#levels'); box.innerHTML = '';
  let total = 0; for (const k in save.s) total += save.s[k];
  $('#starTotal').textContent = total;
  const cur = Math.min(save.u, LEVELS);
  $('#btnPlay').textContent = save.u > LEVELS ? T('replay', { n: LEVELS }) : (save.u === 1 ? T('start') : T('cont', { n: cur }));
  syncModes();
  let curEl = null;
  for (let d = 0; d < LEVELS / 10; d++) {
    if (d * 10 + 1 > save.u + 10 && d > 0) {
      const sec = document.createElement('section'); sec.className = 'day future';
      sec.innerHTML = `<h3>${D.chapters[d]} <span>${T('range', { a: d * 10 + 1, b: d * 10 + 10 })}</span></h3>`;
      box.appendChild(sec); continue;
    }
    const sec = document.createElement('section'); sec.className = 'day';
    sec.innerHTML = `<h3>${D.chapters[d]} <span>${T('range', { a: d * 10 + 1, b: d * 10 + 10 })}</span></h3><div class="row"></div>`;
    const row = sec.querySelector('.row');
    for (let k = 1; k <= 10; k++) {
      const n = d * 10 + k, locked = n > save.u, st = save.s[n] || 0;
      const b = document.createElement('button');
      b.className = 'lv' + (locked ? ' locked' : '') + (n === cur && save.u <= LEVELS ? ' current' : '');
      b.disabled = locked; b.setAttribute('aria-label', T('lvAria', { n }) + ', ' + (locked ? T('locked') : T('starsAria', { n: st })));
      b.innerHTML = locked
        ? `<span class="num">${n}</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V8a3 3 0 0 0-6 0v2z"/></svg>`
        : `<span class="num">${n}</span>${starsHtml(st)}`;
      if (!locked) b.addEventListener('click', () => { sfx.unlock(); startLevel(n); });
      if (n === cur) curEl = b;
      row.appendChild(b);
    }
    box.appendChild(sec);
  }
  if (curEl) requestAnimationFrame(() => curEl.scrollIntoView({ block: 'center' }));
}
function applyLang(l) {
  lang = I18N[l] ? l : 'uk'; D = I18N[lang];
  document.documentElement.lang = lang; document.title = D.title;
  $('#gameTitle').textContent = D.title; $('#tagline').textContent = D.tagline;
  $('#modes').setAttribute('aria-label', D.modesAria);
  document.querySelectorAll('#modes [data-mode]').forEach(b => { b.textContent = D.modes[b.dataset.mode]; });
  document.querySelectorAll('.btnMusic').forEach(b => b.setAttribute('aria-label', D.music));
  document.querySelectorAll('.btnSound').forEach(b => b.setAttribute('aria-label', D.sounds));
  $('#btnBack').setAttribute('aria-label', D.toMapAria); $('#backTxt').textContent = D.map;
  $('#lvlWord').textContent = D.level; $('#bestWord').textContent = D.record; $('#scoreWord').textContent = D.score;
  for (const k of Object.keys(TOOLS)) { $('#tw-' + k).textContent = D.tools[k]; $('#tool-' + k).setAttribute('aria-label', D.toolsAria[k]); }
  $('#cv').setAttribute('aria-label', D.board);
  $('#langs').setAttribute('aria-label', D.langAria);
  $('#langs').innerHTML = Object.keys(I18N).map(k => `<button data-lang="${k}" lang="${k}" aria-pressed="${k === lang}" title="${I18N[k].langName}">${LANG_SHORT[k]}</button>`).join('');
  lastCounter = '';
}
$('#langs').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b) return;
  save.lang = b.dataset.lang; persist(); applyLang(save.lang); showMap(); sfx.unlock(); sfx.swap();
});
function syncModes() {
  mode = MODES[save.mode] ? save.mode : 'moves';
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('#modeHint').textContent = D.hints[mode];
}
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  save.mode = b.dataset.mode; persist(); syncModes(); sfx.unlock(); sfx.swap();
});
function startLevel(n) {
  L = makeLevel(n); mode = save.mode;
  moves = L.moves; used = 0; timeLeft = L.time; tools = { ...TOOLS }; spoonMode = false; lastCounter = ''; score = 0; extraUsed = false; selected = -1; hint = null; playing = false; busy = false;
  orders = L.orders.map(o => ({ ...o, got: 0 }));
  G = L.glaze.slice();
  fx.parts.length = fx.beams.length = fx.texts.length = 0;
  fillBoard();
  for (const p of B) { p.dr = p.r - N - 1; p.a = 1; }
  $('#lvlNum').textContent = n;
  $('#orderNo').textContent = T('orderNo', { n: String(n).padStart(3, '0') });
  $('#who').textContent = D.customers[L.cust][0];
  $('#why').textContent = D.customers[L.cust][1];
  showScreen('game'); resize(); buildGoals(); updateHud(); showIntro();
}
async function beginPlay() {
  busy = true;
  await animateFall(B.map(p => ({ p, from: p.dr, delay: (N - 1 - p.r) * 25 + p.c * 12 })));
  busy = false; playing = true; lastAct = performance.now(); updateHud();
}

$('#btnPlay').addEventListener('click', () => { sfx.unlock(); startLevel(Math.min(save.u, LEVELS)); });
$('#btnBack').addEventListener('click', () => { if (busy) return; if (playing) showLeave(); else showMap(); });
function syncSoundBtn() {
  document.querySelectorAll('.btnSound').forEach(b => { b.classList.toggle('off', !save.snd); b.setAttribute('aria-pressed', String(save.snd)); });
  document.querySelectorAll('.btnMusic').forEach(b => { b.classList.toggle('off', !save.mus); b.setAttribute('aria-pressed', String(save.mus)); });
}
document.querySelectorAll('.btnSound').forEach(b => b.addEventListener('click', () => { save.snd = !save.snd; persist(); syncSoundBtn(); sfx.unlock(); if (save.snd) sfx.special(); }));
document.querySelectorAll('.btnMusic').forEach(b => b.addEventListener('click', () => { save.mus = !save.mus; persist(); syncSoundBtn(); sfx.unlock(); sfx.musicSync(); }));
syncSoundBtn();
$('#tool-helper').addEventListener('click', () => { sfx.unlock(); useHelper(); });
$('#tool-mix').addEventListener('click', () => { sfx.unlock(); useMix(); });
$('#tool-spoon').addEventListener('click', () => {
  sfx.unlock(); if (busy || !playing || tools.spoon <= 0) return;
  spoonMode = !spoonMode; selected = -1; updateHud();
  if (spoonMode) floatText(T('fxTap'), 3.5, 3.2, true);
});
document.addEventListener('pointerdown', () => sfx.unlock(), { once: true });

/* ---------- input ---------- */
let down = null;
function cellAt(e) {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (S / rect.width) - pad, y = (e.clientY - rect.top) * (S / rect.height) - pad;
  const c = Math.floor(x / cs), r = Math.floor(y / cs);
  return (r < 0 || r >= N || c < 0 || c >= N) ? -1 : r * N + c;
}
const adjacent = (a, b) => (Math.abs(a - b) === N) || (Math.abs(a - b) === 1 && Math.floor(a / N) === Math.floor(b / N));
cv.addEventListener('pointerdown', e => {
  sfx.unlock();
  if (busy || !playing) return;
  const cell = cellAt(e); if (cell < 0) return;
  if (spoonMode) { useSpoon(cell); return; }
  down = { cell, x: e.clientX, y: e.clientY, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  lastAct = performance.now(); hint = null;
});
cv.addEventListener('pointermove', e => {
  if (!down || down.moved) return;
  const rect = cv.getBoundingClientRect(), th = cs * (rect.width / S) * .32;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  down.moved = true;
  const r = Math.floor(down.cell / N), c = down.cell % N;
  let tr = r, tc = c;
  if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1; else tr += dy > 0 ? 1 : -1;
  if (tr >= 0 && tr < N && tc >= 0 && tc < N) trySwap(down.cell, tr * N + tc);
});
function endPointer() {
  if (down && !down.moved && !busy && playing) {
    const cell = down.cell;
    if (selected >= 0 && adjacent(selected, cell)) trySwap(selected, cell);
    else selected = selected === cell ? -1 : cell;
  }
  down = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', () => { down = null; });

/* ---------- render ---------- */
let lastT = 0;
function render(now) {
  requestAnimationFrame(render);
  const dt = Math.min(.05, (now - (lastT || now)) / 1000); lastT = now;
  if ($('#game').hidden || !S || !B.length) return;
  const g = ctx;
  if (mode === 'time' && playing && ov.hidden) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      if (!busy) { playing = false; if (ordersDone()) winSequence(); else { sfx.lose(); showLose(); } }
    }
    updateCounter();
  }
  g.clearRect(0, 0, S, S);
  g.save();
  if (fx.shake > .3) { g.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake); fx.shake *= Math.pow(.02, dt); } else fx.shake = 0;
  g.fillStyle = '#3B2224'; rrect(g, 0, 0, S, S, S * .045); g.fill();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = pad + c * cs, y = pad + r * cs, i = r * N + c;
    g.fillStyle = (r + c) % 2 ? '#5A363B' : '#4E2D32'; rrect(g, x + 1.5, y + 1.5, cs - 3, cs - 3, cs * .18); g.fill();
    if (G[i] > 0) {
      g.fillStyle = G[i] > 1 ? '#F7C6D7' : 'rgba(251,214,228,.62)';
      rrect(g, x + 3, y + 3, cs - 6, cs - 6, cs * .2); g.fill();
      if (G[i] > 1) { g.strokeStyle = '#FFFFFF'; g.lineWidth = 2; g.stroke(); }
      g.fillStyle = G[i] > 1 ? '#F7C6D7' : 'rgba(251,214,228,.62)';
      circ(g, x + cs * .3, y + cs - 4, cs * .07); circ(g, x + cs * .68, y + cs - 3, cs * .09);
    }
  }
  if (playing && !busy && !hint && now - lastAct > 6000) hint = findMove();
  if (hint) {
    g.fillStyle = `rgba(255,236,170,${.18 + .16 * Math.sin(now / 180)})`;
    for (const i of hint) { const x = pad + (i % N) * cs, y = pad + Math.floor(i / N) * cs; rrect(g, x + 2, y + 2, cs - 4, cs - 4, cs * .2); g.fill(); }
  }
  if (selected >= 0) {
    const x = pad + (selected % N) * cs, y = pad + Math.floor(selected / N) * cs;
    g.strokeStyle = '#FFE08A'; g.lineWidth = 3; rrect(g, x + 2.5, y + 2.5, cs - 5, cs - 5, cs * .2); g.stroke();
  }
  g.save(); rrect(g, pad, pad, cs * N, cs * N, cs * .18); g.clip();
  for (let i = 0; i < N * N; i++) {
    const p = B[i]; if (!p) continue;
    const spr = sprite(p.t, p.sp);
    let s = p.s;
    if (i === selected) s *= 1.06 + .04 * Math.sin(now / 140);
    else if (hint && hint.includes(i)) s *= 1 + .05 * Math.sin(now / 180);
    const w = spr.width / dpr * s, x = pad + (p.dc + .5) * cs, y = pad + (p.dr + .5) * cs;
    g.globalAlpha = p.a; g.drawImage(spr, x - w / 2, y - w / 2, w, w); g.globalAlpha = 1;
  }
  g.restore();
  for (let k = fx.beams.length - 1; k >= 0; k--) {
    const b = fx.beams[k]; b.life += dt; const u = b.life / b.max;
    if (u >= 1) { fx.beams.splice(k, 1); continue; }
    const al = 1 - u;
    if (b.k === 'h' || b.k === 'v') {
      const th = cs * .75 * (1 - u * .6);
      g.fillStyle = `rgba(255,248,230,${al * .85})`;
      if (b.k === 'h') { const y = pad + (b.r + .5) * cs; rrect(g, pad, y - th / 2, cs * N, th, th / 2); }
      else { const x = pad + (b.c + .5) * cs; rrect(g, x - th / 2, pad, th, cs * N, th / 2); }
      g.fill();
    } else if (b.k === 'ring') {
      const [x, y] = [pad + (b.c + .5) * cs, pad + (b.r + .5) * cs];
      g.strokeStyle = `rgba(255,236,170,${al})`; g.lineWidth = cs * .22 * al + 1;
      g.beginPath(); g.arc(x, y, cs * (.4 + b.rad * u), 0, TAU); g.stroke();
    } else if (b.k === 'link') {
      const [x1, y1] = centerOf(b.from), [x2, y2] = centerOf(b.to);
      g.strokeStyle = `rgba(255,250,235,${al * .9})`; g.lineWidth = 3; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
  }
  for (let k = fx.parts.length - 1; k >= 0; k--) {
    const p = fx.parts[k]; p.life += dt; if (p.life >= p.max) { fx.parts.splice(k, 1); continue; }
    if (p.rect) {
      p.vy += 520 * dt * (cs / 45); p.vx *= Math.pow(.3, dt); p.vy *= Math.pow(.5, dt); p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      g.globalAlpha = Math.min(1, 2 * (1 - p.life / p.max)); g.fillStyle = p.col;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.abs(Math.cos(p.rot * 1.3)) + .2); g.fillRect(-p.size, -p.size * .5, p.size * 2, p.size); g.restore();
      continue;
    }
    p.vy += 900 * dt * (cs / 45); p.x += p.vx * dt; p.y += p.vy * dt;
    g.globalAlpha = 1 - p.life / p.max; g.fillStyle = p.col; circ(g, p.x, p.y, p.size);
  }
  g.globalAlpha = 1;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  for (let k = fx.texts.length - 1; k >= 0; k--) {
    const t = fx.texts[k]; t.life += dt; const u = t.life / t.max;
    if (u >= 1) { fx.texts.splice(k, 1); continue; }
    g.globalAlpha = u > .7 ? (1 - u) / .3 : 1;
    if (t.mid) {
      const size = cs * .5 * t.scale * (1 + .25 * Math.max(0, 1 - u * 5));
      g.font = `900 ${size}px Nunito, system-ui, sans-serif`; g.lineWidth = size * .24;
      g.strokeStyle = '#3B2224'; g.strokeText(t.text, t.x, t.y - cs * .3 * u);
      g.fillStyle = '#FFE08A'; g.fillText(t.text, t.x, t.y - cs * .3 * u);
      continue;
    }
    const rise = t.big ? 0 : cs * .8 * u;
    const sc = t.big ? Math.min(1, u * 6) * (1 + .05 * Math.sin(u * 10)) : 1;
    const size = t.big ? Math.min(S * .1, 52) : cs * .42;
    g.font = t.big ? `400 ${size * sc}px Lobster, Georgia, serif` : `900 ${size}px Nunito, system-ui, sans-serif`;
    g.lineWidth = t.big ? size * .18 : size * .22;
    g.strokeStyle = t.big ? '#FFFBF5' : '#3B2224'; g.strokeText(t.text, t.x, t.y - rise);
    g.fillStyle = t.big ? '#C9245E' : '#FFE08A'; g.fillText(t.text, t.x, t.y - rise);
  }
  g.globalAlpha = 1;
  g.restore();
  if (fx.flash > 0) { g.fillStyle = `rgba(255,250,240,${fx.flash})`; rrect(g, 0, 0, S, S, S * .045); g.fill(); fx.flash = Math.max(0, fx.flash - dt * 1.4); }
  if (spoonMode) { g.strokeStyle = `rgba(255,224,138,${.6 + .3 * Math.sin(now / 150)})`; g.lineWidth = 5; rrect(g, 2.5, 2.5, S - 5, S - 5, S * .045); g.stroke(); }
}
requestAnimationFrame(render);

applyLang(save.lang || detectLang());
showMap();
})();
